<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Categoría</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        
        .form-card {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #2a2a2a;
        }
        
        h1 {
            color: #fff;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #e0e0e0;
            font-weight: 600;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 14px;
            background: #252525;
            color: #e0e0e0;
            transition: 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #1e90ff;
            box-shadow: 0 0 0 3px rgba(30, 144, 255, 0.1);
        }
        
        .tipo-info {
            background: #252525;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            color: #e0e0e0;
            border: 1px solid #333;
        }
        
        .botones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 25px;
        }
        
        button {
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }
        
        .btn-guardar {
            background: #28a745;
            color: white;
        }
        
        .btn-guardar:hover {
            background: #20c997;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.2);
        }
        
        .btn-cancelar {
            background: #444;
            color: #e0e0e0;
        }
        
        .btn-cancelar:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-card">
            <h1>Editar Categoría</h1>
            
            {% if get_flashed_messages() %}
                {% for category, message in get_flashed_messages(with_categories=true) %}
                    {% if category == 'success' %}
                        <div style="padding: 15px; background: #d4edda; color: #155724; border-radius: 6px; border-left: 4px solid #28a745; margin-bottom: 10px; font-size: 14px;">
                            {{ message }}
                        </div>
                    {% else %}
                        <div style="padding: 15px; background: #f8d7da; color: #721c24; border-radius: 6px; border-left: 4px solid #dc3545; margin-bottom: 10px; font-size: 14px;">
                            {{ message }}
                        </div>
                    {% endif %}
                {% endfor %}
            {% endif %}
            
            <form method="POST">
                <div class="form-group">
                    <label>Nombre de la Categoría</label>
                    <input type="text" name="nombre" value="{{ categoria.nombre }}" required autocomplete="off">
                </div>
                
                <div class="form-group">
                    <label>Tipo</label>
                    <div class="tipo-info">
                        {{ categoria.tipo.capitalize() }}
                    </div>
                    <small style="color: #888; margin-top: 5px; display: block;">El tipo no se puede cambiar</small>
                </div>
                
                <div class="botones">
                    <button type="submit" class="btn-guardar">Guardar</button>
                    <button type="button" class="btn-cancelar" onclick="window.location.href='/categorias'">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
